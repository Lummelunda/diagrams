<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Diagram viewer · draw.io</title><style>
:root{color-scheme:light;font-family:Arial,Helvetica,sans-serif;color:#323747;background:#FFFFFF;--ink:#323747;--muted:#5A5F68;--rule:#D1D5DB;--paper:#F4F5F7;--blue:#004B87;--orange:#F36B34}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{width:100%;height:100%;margin:0}body{display:flex;flex-direction:column;height:100dvh;min-height:500px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:16px 24px;border-bottom:1px solid var(--rule);background:#fff}.eyebrow{font:600 10px/1.5 monospace;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}h1{margin:4px 0 0;font:normal 25px/1.2 Georgia,serif}.controls{display:flex;flex-wrap:wrap;gap:8px}button,.link-button{font:500 13px/1.3 Arial,Helvetica,sans-serif;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:38px}button:hover,.link-button:hover{border-color:var(--blue)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.workspace{display:flex;flex:1;min-height:0}.sidebar{width:300px;flex:0 0 300px;display:flex;flex-direction:column;border-right:1px solid var(--rule);background:var(--paper);min-height:0}.sidebar-heading{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}.sidebar-heading h2{font-size:14px;margin:0}.count{font:11px monospace;color:var(--muted)}.scaleout-navigation{flex:1;overflow-y:auto;min-height:0;padding:0 12px 16px}.diagram-item{display:block;text-align:left;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:4px;background:transparent;line-height:1.45;font-size:13px;font-weight:400;min-height:40px;margin:3px 0;overflow-wrap:anywhere}.diagram-item:hover{background:#fff;border-color:var(--rule)}.diagram-item.selected{background:#E6EDF3;color:var(--blue);font-weight:600;border-color:transparent;border-left:3px solid var(--orange);padding-left:10px}.other-examples{border-top:1px solid var(--rule);flex-shrink:0;max-height:45%;overflow:auto;background:#fff}.other-examples summary{cursor:pointer;padding:17px 20px;font-size:13px;font-weight:600;list-style-position:inside}.other-examples summary .count{float:right;padding-top:3px}.examples-navigation{padding:0 12px 14px}.editor-column{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}.current-diagram{padding:16px 22px;border-bottom:1px solid var(--rule);background:#fff}.current-diagram h2{font-size:16px;font-weight:600;line-height:1.4;margin:0 0 4px}.path{font:10px/1.5 monospace;color:var(--muted);overflow-wrap:anywhere}.status-row{padding:8px 22px;border-bottom:1px solid var(--rule);font-size:12px;line-height:1.5;color:var(--muted);display:flex;gap:8px 20px;justify-content:space-between;flex-wrap:wrap;background:#fff}#status.error{color:#A6421C}.hint{font-size:11px}.editor-area{flex:1;min-height:0;display:flex;background:var(--paper)}iframe{display:block;width:100%;height:100%;border:0;flex:1;min-height:300px;background:var(--paper)}.empty{display:grid;place-items:center;width:100%;padding:32px;color:var(--muted);font-size:14px;text-align:center}@media(max-width:850px){.sidebar{width:250px;flex-basis:250px}.hint{width:100%}header{padding:14px 18px}}@media(max-width:600px){body{height:auto;min-height:100dvh}.workspace{flex-direction:column}.sidebar{width:100%;flex-basis:auto;border-right:0;border-bottom:1px solid var(--rule);max-height:none;flex-shrink:0}.scaleout-navigation{max-height:220px;flex:none}.other-examples{max-height:160px}.editor-column{min-height:600px}.editor-area{min-height:450px}.current-diagram,.status-row{padding-left:16px;padding-right:16px}header{align-items:start}.controls{gap:6px}.controls button,.link-button{padding:9px 10px;font-size:12px}.sidebar-heading{padding-top:14px}}
.editor-column{position:relative}.status-message{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}.status-message.error{z-index:2;top:12px;left:16px;right:16px;width:auto;height:auto;padding:10px 14px;margin:0;overflow:visible;clip-path:none;white-space:normal;background:#FEF0EB;color:#323747;border:1px solid #F36B34;border-radius:6px;font-size:12px;line-height:1.5}</style></head><body><header><div class="brand"><div class="eyebrow">Diagram kit / GitHub diagrams</div><h1>Explore and edit diagrams</h1></div><div class="controls"><button id="open-button" type="button" disabled>Reload diagram</button><button id="download-button" class="primary" type="button" disabled>Download edits</button><a id="github-link" class="link-button" href="https://github.com/Lummelunda/diagrams/tree/main/scaleout-diagrams" target="_blank" rel="noopener noreferrer">View on GitHub</a></div></header><div class="workspace"><aside class="sidebar" aria-label="Diagram library"><div class="sidebar-heading"><h2 id="scaleout-heading">Scaleout diagrams</h2><span id="scaleout-count" class="count"></span></div><nav class="scaleout-navigation" aria-labelledby="scaleout-heading"><div id="scaleout-list"></div></nav><details id="other-examples" class="other-examples"><summary>Other examples <span id="examples-count" class="count"></span></summary><nav class="examples-navigation" aria-label="Other example diagrams"><div id="examples-list"></div></nav></details></aside><main class="editor-column"><span id="status" class="status-message" role="status" aria-live="polite">Finding diagrams on GitHub…</span><div id="editor-area" class="editor-area"><div class="empty" id="empty">Choose a diagram to open it in draw.io.</div><iframe id="editor" title="Embedded draw.io editor" hidden></iframe></div></main></div><script>
"use strict";
    const REPO = "Lummelunda/diagrams";
    const BRANCH = "main";
    // Known diagrams stay selectable even if GitHub returns an incomplete listing.
    const FALLBACK_FILES = {
      "examples": [
            "data-flow.drawio",
            "deployment.drawio",
            "distributed-modelops.drawio",
            "it-state.drawio",
            "lifecycle.drawio",
            "logical-architecture.drawio",
            "operational-ai-proximity.drawio",
            "platform.drawio",
            "simple.drawio",
            "three-sections.drawio",
            "tree.drawio"
      ],
      "scaleout-diagrams": [
            "continuous-vision-improvement-loop.drawio",
            "distributed-modelops.drawio",
            "federated-learning-architecture.drawio",
            "logical-architecture.drawio",
            "operational-ai-layers.drawio",
            "operational-ai-proximity.drawio",
            "platform-product-relationship.drawio",
            "platform-technical-introduction-architecture.drawio",
            "tcvn-deployment-topology.drawio",
            "tcvn-federated-scaling.drawio",
            "tcvn-ground-node-variant.drawio",
            "tcvn-multi-site.drawio",
            "vision-learning-sequence.drawio"
      ]
};

    const params = new URLSearchParams(location.search);
    const requestedEditor = params.get("drawio") || "https://embed.diagrams.net/";
    let editorBase;
    try {
      editorBase = new URL(requestedEditor);
      if (!["https:", "http:"].includes(editorBase.protocol)) throw new Error("Invalid editor protocol");
    } catch {
      editorBase = new URL("https://embed.diagrams.net/");
    }
    const editorOrigin = editorBase.origin;
    editorBase.searchParams.set("embed", "1");
    editorBase.searchParams.set("proto", "json");
    editorBase.searchParams.set("spin", "1");
    editorBase.searchParams.set("libraries", "0");
    editorBase.searchParams.set("sidebar", "0");
    editorBase.searchParams.set("format", "0");
    editorBase.searchParams.set("noExitBtn", "1");
    editorBase.searchParams.set("saveAndExit", "0");


    const scaleoutList = document.getElementById("scaleout-list");
    const examplesList = document.getElementById("examples-list");
    const otherExamples = document.getElementById("other-examples");
    const openButton = document.getElementById("open-button");
    const downloadButton = document.getElementById("download-button");
    const githubLink = document.getElementById("github-link");
    const status = document.getElementById("status");
    const editor = document.getElementById("editor");
    const empty = document.getElementById("empty");
    const counts = { "scaleout-diagrams": document.getElementById("scaleout-count"), examples: document.getElementById("examples-count") };
    const state = { currentName: "", currentFolder: "", xml: "", pendingXml: "", editorReady: false,
      dirty: false, loading: false, fallbackList: false, lists: { ...FALLBACK_FILES }, fallbackFolders: new Set() };
    function setStatus(message, error = false) {
      status.textContent = message;
      status.className = error ? "status-message error" : "status-message";
    }
    function rawUrl(name, folder) {
      return `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${folder}/${encodeURIComponent(name)}`;
    }
    function githubUrl(name, folder) {
      return `https://github.com/${REPO}/blob/${BRANCH}/${folder}/${encodeURIComponent(name)}`;
    }
    function displayName(name) {
      return name.replace(/\.drawio$/i, "").replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase()).replace(/\bTcvn\b/g, "TCVN").replace(/\bModelops\b/g, "ModelOps");
    }
    function updateSelection() {
      document.querySelectorAll(".diagram-item").forEach(button => {
        const selected = button.dataset.name === state.currentName && button.dataset.folder === state.currentFolder;
        button.classList.toggle("selected", selected);
        if (selected) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
        button.disabled = state.loading;
      });
      openButton.disabled = state.loading || !state.currentName;
    }
    function renderLists() {
      for (const [folder, container] of [["scaleout-diagrams", scaleoutList], ["examples", examplesList]]) {
        container.replaceChildren();
        const names = state.lists[folder];
        counts[folder].textContent = String(names.length);
        for (const name of names) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "diagram-item";
          button.dataset.name = name;
          button.dataset.folder = folder;
          button.textContent = displayName(name);
          button.title = `${folder}/${name}`;
          button.addEventListener("click", () => loadDiagram(name, folder));
          container.appendChild(button);
        }
      }
      updateSelection();
    }
    function validDiagram(xml) {
      const doc = new DOMParser().parseFromString(xml, "application/xml");
      return !doc.querySelector("parsererror") && ["mxfile", "mxGraphModel"].includes(doc.documentElement.localName);
    }

    function send(message) {
      editor.contentWindow.postMessage(JSON.stringify(message), editorOrigin);
    }

    function startEditor(xml, name, folder) {
      state.currentName = name;
      state.currentFolder = folder;
      state.xml = xml;
      state.pendingXml = xml;
      state.editorReady = false;
      state.dirty = false;
      githubLink.href = githubUrl(name, folder);
      empty.hidden = true;
      editor.hidden = false;
      editor.src = editorBase.toString();
      downloadButton.disabled = true;
      document.title = `${displayName(name)} · Diagram viewer`;
      otherExamples.open = folder === "examples";
      updateSelection();
      setStatus(`Opening ${name} in draw.io…`);
    }

    function download(xml) {
      if (!validDiagram(xml)) {
        setStatus("The editor returned invalid diagram XML. Nothing was downloaded.", true);
        return;
      }
      const blob = new Blob([xml], { type: "application/xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = state.currentName || "diagram.drawio";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.xml = xml;
      state.dirty = false;
      setStatus(`Downloaded ${anchor.download}. GitHub was not changed.`);
    }


    async function loadDiagram(name, folder) {
      if (!name || state.loading || !Object.hasOwn(FALLBACK_FILES, folder)) return;
      if (state.dirty && !confirm("You have edits that have not been downloaded. Discard them and open another diagram?")) return;
      state.loading = true;
      const wasDownloadDisabled = downloadButton.disabled;
      downloadButton.disabled = true;
      updateSelection();
      setStatus(`Fetching ${folder}/${name} from GitHub…`);
      try {
        const response = await fetch(rawUrl(name, folder), { cache: "no-store" });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const xml = await response.text();
        if (!validDiagram(xml)) throw new Error("The file is not valid draw.io XML");
        state.fallbackList = state.fallbackFolders.has(folder);
        startEditor(xml, name, folder);
        const url = new URL(location.href);
        url.searchParams.set("diagram", name);
        url.searchParams.set("folder", folder);
        history.replaceState(null, "", url);
      } catch (error) {
        downloadButton.disabled = wasDownloadDisabled;
        setStatus(`Could not load ${name}: ${error.message}`, true);
      } finally {
        state.loading = false;
        updateSelection();
      }
    }
    async function discoverFolder(folder) {
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${folder}?ref=${BRANCH}`, {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
        const entries = await response.json();
        if (!Array.isArray(entries)) throw new Error("Unexpected listing");
        const discovered = entries.filter(item => item.type === "file" && /\.drawio$/i.test(item.name)).map(item => item.name);
        if (!discovered.length) throw new Error("No diagrams found");
        state.lists[folder] = [...new Set(discovered)].sort((a, b) => a.localeCompare(b));
      } catch {
        state.fallbackFolders.add(folder);
      }
    }
    async function initialize() {
      renderLists();
      await Promise.all([discoverFolder("scaleout-diagrams"), discoverFolder("examples")]);
      renderLists();
      // A click while listings load takes precedence over the initial selection.
      if (state.currentName || state.loading) return;
      const folder = Object.hasOwn(FALLBACK_FILES, params.get("folder")) ? params.get("folder") : "scaleout-diagrams";
      const legacyNames = {
        "scaleout-edge-technical-introduction-architecture.drawio": "platform-technical-introduction-architecture.drawio",
        "scaleout-logical-architecture.drawio": "logical-architecture.drawio"
      };
      const originalRequest = params.get("diagram");
      const requested = folder === "scaleout-diagrams" ? (legacyNames[originalRequest] || originalRequest) : originalRequest;
      const preferred = folder === "scaleout-diagrams" ? "platform-technical-introduction-architecture.drawio" : "data-flow.drawio";
      const names = state.lists[folder];
      const name = names.includes(requested) ? requested : (names.includes(preferred) ? preferred : names[0]);
      await loadDiagram(name, folder);
    }
    window.addEventListener("message", event => {
      if (event.origin !== editorOrigin || event.source !== editor.contentWindow) return;
      let message;
      try { message = typeof event.data === "string" ? JSON.parse(event.data) : event.data; }
      catch { return; }
      if (!message || typeof message !== "object") return;
      switch (message.event) {
        case "init":
          state.editorReady = true;
          if (state.pendingXml) {
            send({ action: "load", xml: state.pendingXml, title: state.currentName,
              autosave: 1, modified: 0, noExitBtn: 1, fit: 1 });
            state.pendingXml = "";
          }
          break;
        case "load":
          if (message.error) {
            setStatus(`draw.io could not open ${state.currentName}: ${message.error}`, true);
            break;
          }
          downloadButton.disabled = false;
          setStatus(`Editing ${state.currentName}. Use Save in draw.io or Download edits above.` +
            (state.fallbackList ? " Showing the built-in diagram list." : ""));
          break;
        case "autosave":
          if (typeof message.xml === "string") {
            state.xml = message.xml;
            state.dirty = true;
            setStatus(`Editing ${state.currentName} · changes not downloaded`);
          }
          break;
        case "save":
          if (typeof message.xml === "string") download(message.xml);
          break;
        case "export":
          if (message.format === "xml" && typeof message.xml === "string") download(message.xml);
          break;
        case "exit":
          setStatus("The editor was closed. Choose Reload diagram to reopen it.");
          break;
      }
    });


    openButton.addEventListener("click", () => loadDiagram(state.currentName, state.currentFolder));
    downloadButton.addEventListener("click", () => {
      if (state.editorReady) send({ action: "export", format: "xml" });
      else if (state.xml) download(state.xml);
    });
    window.addEventListener("beforeunload", event => {
      if (state.dirty) { event.preventDefault(); event.returnValue = ""; }
    });
    initialize();
</script></body></html>
